<body class="mini verify" data-title-ar="التحقق من شهادة | أكاديمية X2D" data-title-en="Verify a certificate | X2D Academy">
<header class="mini-bar">
<a aria-label="X2D — Home" class="logo" href="./">X2D</a>
<button class="lang-btn" id="langBtn" lang="ar" type="button">العربية</button>

<main class="mini-main">
<div class="wrap">
<h1><span class="l-en">Verify a certificate</span><span class="l-ar">اتحقّق من شهادة</span></h1>

</div>
